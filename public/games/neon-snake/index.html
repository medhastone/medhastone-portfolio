<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake | Cyber Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- SEO and Social Tags -->
    <meta name="description" content="A neon twist on the classic snake game. Grow your neon snake and don't hit the walls!">
    <meta name="keywords" content="neon snake, classic snake game, retro arcade, medhastone games, html5 games">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Neon Snake - Medhastone Games">
    <meta property="og:description" content="A neon twist on the classic snake game. Grow your neon snake and don't hit the walls!">
    <meta property="og:image" content="https://medhastone.com/games/neon-snake/og-image.jpg">
    <meta property="og:url" content="https://medhastone.com/games/neon-snake/index.html">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Neon Snake - Medhastone Games">
    <meta name="twitter:description" content="A neon twist on the classic snake game. Grow your neon snake and don't hit the walls!">
    <meta name="twitter:image" content="https://medhastone.com/games/neon-snake/og-image.jpg">
</head>
<body>
    <div id="game-container">
        <!-- The Game Canvas -->
        <canvas id="game-canvas"></canvas>

        <!-- HUD (Heads Up Display) -->
        <div id="hud" class="hidden glass-panel">
            <div class="hud-top">
                <div class="score-container">
                    <span class="label">SCORE</span>
                    <span id="hud-score" class="value">0</span>
                </div>
                <div class="score-container right">
                    <span class="label">BEST</span>
                    <span id="hud-best" class="value">0</span>
                </div>
            </div>
            <div class="hud-center">
                <div id="combo-container" class="hidden">
                    <span id="combo-text">x2 COMBO!</span>
                    <div class="combo-bar-bg">
                        <div id="combo-bar" class="combo-bar-fill"></div>
                    </div>
                </div>
            </div>
            <button id="btn-pause" class="icon-btn">❚❚</button>
            <button id="btn-fs" class="icon-btn">⛶</button>
        </div>

        <!-- Mobile Controls Overlay -->
        <div id="mobile-controls" class="hidden">
            <div class="d-pad">
                <button id="btn-up" class="d-btn">▲</button>
                <div class="d-row">
                    <button id="btn-left" class="d-btn">◀</button>
                    <button id="btn-right" class="d-btn">▶</button>
                </div>
                <button id="btn-down" class="d-btn">▼</button>
            </div>
        </div>

        <!-- Main Menu -->
        <div id="menu-screen" class="screen glass-panel">
            <div class="scanlines"></div>
            <h1 class="glitch-text" data-text="NEON SNAKE">NEON SNAKE</h1>
            <p class="subtitle">CYBER ARCADE EXPERIENCE</p>
            
            <div class="menu-buttons">
                <button id="btn-play" class="neon-btn primary">INITIALIZE RUN</button>
                <button id="btn-settings" class="neon-btn secondary">SYSTEM SETTINGS</button>
            </div>
            
            <div class="stats-preview">
                <div>HIGH SCORE: <span id="menu-high-score" class="neon-text">0</span></div>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen hidden glass-panel">
            <h2>SYSTEM PAUSED</h2>
            <div class="menu-buttons">
                <button id="btn-resume" class="neon-btn primary">RESUME</button>
                <button id="btn-quit" class="neon-btn secondary hover-danger">ABORT RUN</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden glass-panel">
            <h2 class="danger-text">SIGNAL LOST</h2>
            <div class="results-grid">
                <div class="result-box">
                    <span class="label">FINAL SCORE</span>
                    <span id="go-score" class="value neon-text">0</span>
                </div>
                <div class="result-box">
                    <span class="label">MAX COMBO</span>
                    <span id="go-combo" class="value">x1</span>
                </div>
                <div class="result-box">
                    <span class="label">ENERGY COLLECTED</span>
                    <span id="go-energy" class="value">0</span>
                </div>
                <div class="result-box">
                    <span class="label">SURVIVAL TIME</span>
                    <span id="go-time" class="value">0:00</span>
                </div>
            </div>
            <div id="new-record-alert" class="hidden animate-pulse text-cyan">NEW HIGH SCORE ESTABLISHED!</div>
            <div class="menu-buttons">
                <button id="btn-restart" class="neon-btn primary">REBOOT SYSTEM</button>
                <button id="btn-menu" class="neon-btn secondary">MAIN MENU</button>
            </div>
        </div>
        
        <!-- Settings Screen -->
        <div id="settings-screen" class="screen hidden glass-panel">
            <h2>SETTINGS</h2>
            <div class="settings-list">
                <div class="setting-item">
                    <span>SOUND EFFECTS</span>
                    <button id="toggle-sfx" class="toggle-btn active">ON</button>
                </div>
                <div class="setting-item">
                    <span>VISUAL EFFECTS</span>
                    <button id="toggle-vfx" class="toggle-btn active">HIGH</button>
                </div>
                <div class="setting-item">
                    <span>ON-SCREEN CONTROLS (MOBILE)</span>
                    <button id="toggle-controls" class="toggle-btn active">ON</button>
                </div>
            </div>
            <button id="btn-close-settings" class="neon-btn primary mt-4">BACK</button>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
