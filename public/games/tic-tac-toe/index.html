<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TIC TAC TOE PRO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- SEO and Social Tags -->
    <meta name="description" content="Play Tic Tac Toe against the computer or a friend in this classic 3x3 grid game.">
    <meta name="keywords" content="tic tac toe, classic board game, naughts and crosses, medhastone games, html5 games">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tic Tac Toe - Medhastone Games">
    <meta property="og:description" content="Play Tic Tac Toe against the computer or a friend in this classic 3x3 grid game.">
    <meta property="og:image" content="https://medhastone.com/games/tic-tac-toe/og-image.jpg">
    <meta property="og:url" content="https://medhastone.com/games/tic-tac-toe/index.html">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tic Tac Toe - Medhastone Games">
    <meta name="twitter:description" content="Play Tic Tac Toe against the computer or a friend in this classic 3x3 grid game.">
    <meta name="twitter:image" content="https://medhastone.com/games/tic-tac-toe/og-image.jpg">
</head>
<body class="theme-neon">
    <!-- Ambient Background -->
    <div id="ambient-bg"></div>
    <div id="particles"></div>

    <div id="app-container">
        
        <!-- MAIN MENU -->
        <section id="screen-menu" class="screen active glass-panel">
            <div class="title-container">
                <h1 class="glitch-text" data-text="TIC TAC TOE">TIC TAC TOE</h1>
                <h2 class="pro-badge">PRO</h2>
                <p class="tagline">THINK. ADAPT. DOMINATE.</p>
            </div>
            
            <div class="menu-buttons">
                <button class="cyber-btn primary" data-action="nav-setup" data-mode="ai">AI BATTLE</button>
                <button class="cyber-btn" data-action="nav-setup" data-mode="local">2 PLAYER LOCAL</button>
                <button class="cyber-btn secondary" data-action="nav-stats">STATISTICS</button>
            </div>

            <div class="player-mini-profile">
                <div class="rank-badge" id="menu-rank">NOVICE</div>
                <div class="xp-bar"><div class="xp-fill" id="menu-xp"></div></div>
            </div>
        </section>

        <!-- MATCH SETUP -->
        <section id="screen-setup" class="screen glass-panel">
            <h2 class="section-title">MATCH SETUP</h2>
            
            <div class="setup-grid">
                <div class="setup-group">
                    <label>GAME MODE</label>
                    <select id="setup-match-type" class="cyber-select">
                        <option value="quick">QUICK MATCH (1 Round)</option>
                        <option value="bo3">BEST OF 3</option>
                        <option value="bo5">BEST OF 5</option>
                    </select>
                </div>

                <div class="setup-group" id="setup-ai-group">
                    <label>AI DIFFICULTY</label>
                    <select id="setup-ai-diff" class="cyber-select">
                        <option value="easy">ROOKIE (Easy)</option>
                        <option value="medium" selected>STRATEGIST (Medium)</option>
                        <option value="hard">HUNTER (Hard)</option>
                        <option value="master">MASTER (Unbeatable)</option>
                    </select>
                </div>

                <div class="setup-group">
                    <label>YOUR SYMBOL</label>
                    <div class="symbol-select">
                        <button class="sym-btn active" data-sym="X"><span class="sym-x"></span></button>
                        <button class="sym-btn" data-sym="O"><span class="sym-o"></span></button>
                    </div>
                </div>
            </div>

            <div class="action-row">
                <button class="cyber-btn secondary" data-action="nav-menu">BACK</button>
                <button class="cyber-btn primary" data-action="start-match">START MATCH</button>
            </div>
        </section>

        <!-- PLAYING -->
        <section id="screen-game" class="screen">
            <div class="hud">
                <div class="player-card" id="hud-p1">
                    <div class="hud-name" id="hud-p1-name">PLAYER</div>
                    <div class="hud-score" id="hud-p1-score">0</div>
                    <div class="hud-sym" id="hud-p1-sym"></div>
                </div>
                <div class="hud-center">
                    <div id="match-status">ROUND 1</div>
                    <div id="turn-indicator">YOUR TURN</div>
                </div>
                <div class="player-card right" id="hud-p2">
                    <div class="hud-name" id="hud-p2-name">AI</div>
                    <div class="hud-score" id="hud-p2-score">0</div>
                    <div class="hud-sym" id="hud-p2-sym"></div>
                </div>
            </div>

            <div class="board-container">
                <div id="board" class="tic-tac-board">
                    <!-- Cells generated by JS -->
                </div>
                <div id="win-line" class="win-line"></div>
            </div>

            <div class="game-controls">
                <button class="icon-btn" id="btn-undo" title="Undo Move">↩</button>
                <button class="icon-btn" id="btn-hint" title="Get Hint">💡</button>
                <button class="icon-btn" id="btn-quit" title="Surrender">🏳️</button>
            </div>
            
            <div id="feedback-toast" class="toast"></div>
        </section>

        <!-- POST MATCH -->
        <section id="screen-result" class="screen glass-panel">
            <h1 id="result-title" class="result-title">VICTORY</h1>
            
            <div class="result-stats">
                <div class="stat-row"><span>SCORE</span><span id="res-score"></span></div>
                <div class="stat-row"><span>MOVES</span><span id="res-moves"></span></div>
                <div class="stat-row highlight"><span>RATING CHANGE</span><span id="res-rating"></span></div>
                <div class="stat-row xp-row"><span>XP EARNED</span><span id="res-xp"></span></div>
            </div>

            <div class="action-row column">
                <button class="cyber-btn primary" data-action="rematch">REMATCH</button>
                <button class="cyber-btn secondary" data-action="nav-menu">MAIN MENU</button>
            </div>
        </section>

        <!-- STATS -->
        <section id="screen-stats" class="screen glass-panel">
            <h2 class="section-title">STATISTICS</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-val" id="st-rating">1000</div>
                    <div class="stat-lbl">RATING</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="st-winrate">0%</div>
                    <div class="stat-lbl">WIN RATE</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="st-played">0</div>
                    <div class="stat-lbl">GAMES</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="st-streak">0</div>
                    <div class="stat-lbl">BEST STREAK</div>
                </div>
            </div>

            <button class="cyber-btn secondary mt-4" data-action="nav-menu">BACK TO MENU</button>
        </section>

    </div>

    <!-- Audio toggle -->
    <button id="btn-mute" class="floating-btn">🔊</button>

    <script type="module" src="js/main.js"></script>
</body>
</html>
