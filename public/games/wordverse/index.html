<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WordVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Main Menu -->
        <div id="screen-menu" class="screen active">
            <div class="logo-container">
                <h1 class="logo glow-text">WORDVERSE</h1>
                <p class="tagline">THINK. CONNECT. MASTER WORDS.</p>
            </div>
            
            <div class="glass-panel profile-panel">
                <div class="rank-badge" id="menu-rank">WORD ROOKIE</div>
                <div class="xp-bar-container">
                    <div class="xp-bar" id="menu-xp" style="width: 0%"></div>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="cyber-btn primary" data-action="play-rush">TIME RUSH</button>
                <button class="cyber-btn" data-action="play-zen">ZEN MODE</button>
                <button class="cyber-btn secondary" data-action="nav-stats">STATISTICS</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
            <div class="game-header">
                <button class="icon-btn" data-action="nav-menu">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
                <div class="hud-stats">
                    <div class="stat-box">
                        <span class="label">SCORE</span>
                        <span class="val" id="hud-score">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">TIME</span>
                        <span class="val" id="hud-timer">1:30</span>
                    </div>
                </div>
                <div class="combo-badge" id="hud-combo">x2</div>
            </div>

            <div class="game-area">
                <div class="word-preview-container">
                    <div id="word-preview" class="word-preview"></div>
                </div>

                <div class="board-container">
                    <div id="letter-grid" class="letter-grid"></div>
                    <canvas id="swipe-canvas"></canvas>
                </div>

                <div class="powerups">
                    <button class="power-btn" data-action="btn-hint" title="Hint (Cost 20)">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
                    </button>
                    <button class="power-btn" data-action="btn-shuffle" title="Shuffle (Cost 50)">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                    </button>
                </div>

                <div class="found-words-container">
                    <div id="found-words" class="found-words"></div>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="screen-result" class="screen">
            <div class="glass-panel result-panel">
                <h2 class="glow-text">TIME'S UP!</h2>
                <div class="result-stats">
                    <div class="res-item">
                        <span>SCORE</span>
                        <h3 id="result-score">0</h3>
                    </div>
                    <div class="res-item">
                        <span>WORDS FOUND</span>
                        <h3 id="result-words">0</h3>
                    </div>
                    <div class="res-item">
                        <span>NEW RANK</span>
                        <h3 id="result-rank" class="highlight">ROOKIE</h3>
                    </div>
                </div>
                <div class="menu-buttons">
                    <button class="cyber-btn primary" data-action="play-rush">PLAY AGAIN</button>
                    <button class="cyber-btn secondary" data-action="nav-menu">MAIN MENU</button>
                </div>
            </div>
        </div>

        <!-- Stats Screen -->
        <div id="screen-stats" class="screen">
            <h2 class="glow-text text-center">STATISTICS</h2>
            <div class="glass-panel stats-grid">
                <div class="st-item"><span>GAMES PLAYED</span><strong id="st-played">0</strong></div>
                <div class="st-item"><span>WORDS FOUND</span><strong id="st-words">0</strong></div>
                <div class="st-item"><span>BEST SCORE</span><strong id="st-best">0</strong></div>
                <div class="st-item"><span>LONGEST WORD</span><strong id="st-longest">-</strong></div>
                <div class="st-item"><span>DAILY STREAK</span><strong id="st-streak">0</strong></div>
            </div>
            <div class="menu-buttons mt-4">
                <button class="cyber-btn secondary" data-action="nav-menu">BACK</button>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
