<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sudoku Master</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- SEO and Social Tags -->
    <meta name="description" content="Challenge yourself with Sudoku Master. Solve classic number puzzles of varying difficulties.">
    <meta name="keywords" content="sudoku master, number puzzle, logic game, brain training, medhastone games, html5 games">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sudoku Master - Medhastone Games">
    <meta property="og:description" content="Challenge yourself with Sudoku Master. Solve classic number puzzles of varying difficulties.">
    <meta property="og:image" content="https://medhastone.com/games/sudoku-master/og-image.jpg">
    <meta property="og:url" content="https://medhastone.com/games/sudoku-master/index.html">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sudoku Master - Medhastone Games">
    <meta name="twitter:description" content="Challenge yourself with Sudoku Master. Solve classic number puzzles of varying difficulties.">
    <meta name="twitter:image" content="https://medhastone.com/games/sudoku-master/og-image.jpg">
</head>
<body class="theme-dark">
    <canvas id="bg-canvas"></canvas>

    <div id="app">
        
        <!-- Main Menu Screen -->
        <div id="screen-main" class="screen active">
            <div class="logo-container">
                <h1 class="logo">SUDOKU<br><span class="highlight">MASTER</span></h1>
            </div>

            <div class="stats-bar">
                <div class="stat">
                    <svg class="icon-svg text-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 6v12M15 9.5a3 3 0 0 0-3-2.5H10a2.5 2.5 0 0 0 0 5h4a2.5 2.5 0 0 1 0 5h-2.5A3 3 0 0 1 9 14.5"></path>
                    </svg>
                    <span id="menu-coins">0</span>
                </div>
                <div class="stat">
                    <svg class="icon-svg text-blue" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    <span id="menu-xp">0</span> XP
                </div>
            </div>

            <div class="menu-buttons">
                <button class="btn primary pulse" id="btn-quickplay">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="6 4 20 12 6 20 6 4"></polygon>
                    </svg>
                    <span>QUICK PLAY</span>
                </button>
                <button class="btn" id="btn-daily">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>DAILY CHALLENGE</span>
                </button>
                <button class="btn" id="btn-stats">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                    <span>STATISTICS</span>
                </button>
                <button class="btn" id="btn-themes">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
                        <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
                        <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
                        <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
                        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.6 0-.4-.2-.8-.5-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16c3.3 0 6-2.7 6-6 0-5.5-4.5-10-10-10z"></path>
                    </svg>
                    <span>THEMES</span>
                </button>
            </div>
        </div>

        <!-- Difficulty Selection Screen -->
        <div id="screen-difficulty" class="screen">
            <h2>SELECT DIFFICULTY</h2>
            <div class="menu-buttons">
                <button class="btn diff-btn" data-diff="easy">EASY <span class="diff-desc">Relaxed puzzle</span></button>
                <button class="btn diff-btn" data-diff="medium">MEDIUM <span class="diff-desc">Moderate challenge</span></button>
                <button class="btn diff-btn" data-diff="hard">HARD <span class="diff-desc">Advanced logic required</span></button>
                <button class="btn diff-btn" data-diff="expert">EXPERT <span class="diff-desc">Complex techniques</span></button>
                <button class="btn diff-btn" data-diff="master">MASTER <span class="diff-desc">Very few clues</span></button>
            </div>
            <button class="btn btn-back mt-2">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>BACK</span>
            </button>
        </div>

        <!-- Gameplay Screen -->
        <div id="screen-game" class="screen">
            <div class="game-header">
                <button class="icon-btn" id="btn-game-back" title="Back to Menu">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <div class="game-info">
                    <span id="game-difficulty">HARD</span>
                    <span id="game-timer">00:00</span>
                </div>
                <button class="icon-btn" id="btn-game-settings" title="Themes & Settings">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>

            <div class="game-stats">
                <div class="mistakes">Mistakes: <span id="mistake-count">0</span>/3</div>
                <div class="score">Score: <span id="game-score">0</span></div>
            </div>

            <div class="board-container">
                <div id="sudoku-board" class="sudoku-board">
                    <!-- JS will generate 81 cells here -->
                </div>
            </div>

            <div class="tools-container">
                <button class="tool-btn" id="btn-undo">
                    <div class="tool-icon-wrap">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7v6h6"></path>
                            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                        </svg>
                    </div>
                    <span>Undo</span>
                </button>
                <button class="tool-btn" id="btn-erase">
                    <div class="tool-icon-wrap">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                            <line x1="18" y1="9" x2="12" y2="15"></line>
                            <line x1="12" y1="9" x2="18" y2="15"></line>
                        </svg>
                    </div>
                    <span>Erase</span>
                </button>
                <button class="tool-btn" id="btn-notes">
                    <div class="tool-icon-wrap">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </div>
                    <span>Notes</span>
                </button>
                <button class="tool-btn" id="btn-hint">
                    <div class="tool-icon-wrap">
                        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 18h6"></path>
                            <path d="M10 22h4"></path>
                            <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"></path>
                        </svg>
                    </div>
                    <span>Hint</span>
                    <span class="badge" id="hint-count">3</span>
                </button>
            </div>

            <div class="numpad" id="numpad">
                <button class="num-btn" data-num="1">1</button>
                <button class="num-btn" data-num="2">2</button>
                <button class="num-btn" data-num="3">3</button>
                <button class="num-btn" data-num="4">4</button>
                <button class="num-btn" data-num="5">5</button>
                <button class="num-btn" data-num="6">6</button>
                <button class="num-btn" data-num="7">7</button>
                <button class="num-btn" data-num="8">8</button>
                <button class="num-btn" data-num="9">9</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="screen-result" class="screen">
            <h2 id="result-title">PUZZLE SOLVED!</h2>
            
            <div class="result-card">
                <div class="result-row">
                    <span>DIFFICULTY</span>
                    <span class="highlight" id="res-diff">HARD</span>
                </div>
                <div class="result-row">
                    <span>TIME</span>
                    <span class="highlight" id="res-time">05:23</span>
                </div>
                <div class="result-row">
                    <span>MISTAKES</span>
                    <span class="text-red" id="res-mistakes">1/3</span>
                </div>
                <div class="divider"></div>
                <div class="result-row">
                    <span>XP EARNED</span>
                    <span class="text-blue">+<span id="res-xp">150</span></span>
                </div>
                <div class="result-row">
                    <span>COINS</span>
                    <span class="text-gold">+<span id="res-coins">20</span></span>
                </div>
            </div>

            <div class="menu-buttons mt-2">
                <button class="btn primary" id="btn-newgame">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span>NEW GAME</span>
                </button>
                <button class="btn btn-back">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    <span>HOME</span>
                </button>
            </div>
        </div>

        <!-- Statistics Screen -->
        <div id="screen-stats" class="screen">
            <h2>STATISTICS</h2>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="stat-played">0</div>
                    <div class="stat-label">Played</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-won">0</div>
                    <div class="stat-label">Won</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-winrate">0%</div>
                    <div class="stat-label">Win Rate</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="stat-best">--:--</div>
                    <div class="stat-label">Best Time</div>
                </div>
            </div>
            
            <button class="btn btn-back mt-2">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>BACK</span>
            </button>
        </div>
        
        <!-- Themes Screen -->
        <div id="screen-themes" class="screen">
            <h2>THEMES</h2>
            
            <div class="theme-grid" id="theme-grid">
                <!-- Populated by JS -->
            </div>
            
            <button class="btn btn-back mt-2">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>BACK</span>
            </button>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/sudoku.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
