<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Genius</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="screen-loading" class="screen">
        <div class="glass-panel" style="background: transparent; box-shadow: none;">
            <div class="loader"></div>
            <h2 style="color: #4CAF50;">GENERATING PUZZLE...</h2>
        </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
        <div class="glass-panel home-panel">
            <div class="hero-title">
                <h1>MATH GENIUS</h1>
                <p class="tagline">Select your difficulty</p>
            </div>
            
            <div class="diff-selector">
                <button class="diff-btn easy" data-action="play-game" data-diff="easy">EASY</button>
                <button class="diff-btn medium" data-action="play-game" data-diff="medium">MEDIUM</button>
                <button class="diff-btn hard" data-action="play-game" data-diff="hard">HARD</button>
                <button class="diff-btn genius" data-action="play-game" data-diff="genius">GENIUS</button>
            </div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen">
        <header class="game-header">
            <button class="icon-btn" data-action="nav-home">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <div class="diff-indicator" id="game-diff-text">EASY</div>
            <div class="timer-display" id="game-timer">00:00</div>
        </header>

        <div class="board-container" id="board-container">
            <div class="board-zoom" id="board-zoom">
                <!-- Grid generated by JS -->
            </div>
        </div>

        <div class="tile-tray-container">
            <p class="tray-hint">Tap a number, then tap an empty box!</p>
            <div class="tile-tray" id="tile-tray">
                <!-- Tiles generated by JS -->
            </div>
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="glass-panel result-panel">
            <div class="celebration-icon">🏆</div>
            <h2>PUZZLE CLEARED!</h2>
            
            <div class="result-stats">
                <div class="res-item">
                    <span>TIME</span>
                    <h3 id="res-time" class="text-blue">00:00</h3>
                </div>
                <div class="res-item">
                    <span>SCORE</span>
                    <h3 id="res-score" style="color: #FF9800;">+100</h3>
                </div>
            </div>

            <div class="menu-buttons mt-4">
                <button class="diff-btn genius" data-action="next-level">NEXT LEVEL ➔</button>
                <button class="diff-btn" style="background:#888; margin-top:10px" data-action="nav-home">MAIN MENU</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
