<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Color Dash</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-layer">
        <!-- Home Screen -->
        <div id="screen-home" class="screen active">
            <div class="title-container">
                <h1 class="logo-text">COLOR<br><span class="accent">DASH</span></h1>
                <div class="logo-subtitle">NEON ARCADE RUNNER</div>
            </div>
            
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-label">BEST SCORE</span>
                    <span id="home-best" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">GEMS</span>
                    <span id="home-gems" class="stat-value text-cyan">0</span>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; width: 100%; max-width: 400px;">
                <button id="btn-play" class="cyber-btn primary-glow" style="flex: 3;">
                    <span class="btn-text">TAP TO START</span>
                    <div class="btn-shine"></div>
                </button>
                <button id="btn-skins" class="cyber-btn" style="flex: 1; padding: 1.2rem 0; display: flex; justify-content: center; align-items: center;">
                    <span class="material-icons">palette</span>
                </button>
            </div>

            <div class="controls-hint">
                <div class="hint-item"><span class="material-icons">swipe</span> Swipe Left/Right to Move</div>
                <div class="hint-item"><span class="material-icons">touch_app</span> Tap to Jump</div>
                <div class="hint-item"><span class="material-icons">warning</span> Match Your Color!</div>
            </div>
        </div>

        <!-- HUD Screen -->
        <div id="screen-hud" class="screen">
            <div class="hud-top">
                <div class="hud-card">
                    <span class="label">SCORE</span>
                    <span id="hud-score" class="value">0</span>
                </div>
                <div class="hud-card">
                    <span class="material-icons gem-icon text-cyan">diamond</span>
                    <span id="hud-gems" class="value">0</span>
                </div>
            </div>
            <div id="color-indicator" class="color-indicator">CURRENT COLOR</div>
        </div>

        <!-- Game Over Screen -->
        <div id="screen-gameover" class="screen glass-modal">
            <div class="modal-content">
                <h2 class="gameover-title error-text">SYSTEM FAILURE</h2>
                
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="score-label">FINAL SCORE</div>
                        <div id="go-score" class="score-value">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="score-label">BEST SCORE</div>
                        <div id="go-best" class="score-value">0</div>
                    </div>
                    <div class="stat-item full-width">
                        <div class="score-label">GEMS COLLECTED</div>
                        <div id="go-gems" class="score-value text-cyan">+0</div>
                    </div>
                </div>

                <button id="btn-restart" class="cyber-btn primary-glow">
                    <span class="btn-text">REBOOT</span>
                    <div class="btn-shine"></div>
                </button>
                <button id="btn-home" class="text-btn">MAIN MENU</button>
            </div>
        </div>

        <!-- Skins Screen -->
        <div id="screen-skins" class="screen glass-modal">
            <div class="modal-content" style="max-width: 550px; width: 90%;">
                <h2 class="gameover-title" style="font-size: 1.8rem; margin-bottom: 1rem;">SELECT CORE</h2>
                <div id="skins-grid" class="skins-grid">
                    <!-- Injected via JS -->
                </div>
                <button id="btn-close-skins" class="cyber-btn primary-glow" style="margin-top: 2rem;">
                    <span class="btn-text">CONFIRM</span>
                    <div class="btn-shine"></div>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
